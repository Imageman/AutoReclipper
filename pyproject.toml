[project]
name = "autoreclipper"
version = "0.1.0"
description = "Clipboard automation utility using LLM templates."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "customtkinter>=5.2.2",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "pillow>=11.2.1",
    "pynput>=1.8.1",
    "pyperclip>=1.9.0",
    "pystray>=0.19.5",
    "python-dotenv>=1.1.0",
    "pywin32>=310; platform_system == 'Windows'",
]
